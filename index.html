<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Aplica el tema antes de pintar para que no haya un destello claro al abrir en oscuro. -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('volare-tema');
          var oscuro = guardado === 'oscuro' || ((guardado !== 'claro') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
          document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Urbanización Volare</title>
    <!-- RF-06: descripción para buscadores y vista previa al compartir el enlace. -->
    <meta name="description" content="Plataforma de la Urbanización Volare: noticias de la comunidad, reservas de cabañas y Casa Club, y servicios para propietarios." />
    <meta property="og:title" content="Urbanización Volare" />
    <meta property="og:description" content="Noticias de la comunidad, reservas de cabañas y Casa Club, y servicios para propietarios de la Urbanización Volare." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://urbvolare.com/" />
    <meta property="og:image" content="https://urbvolare.com/logo-volare.png" />
    <meta property="og:locale" content="es_EC" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
